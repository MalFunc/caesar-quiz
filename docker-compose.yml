services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-caesar_quiz}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: host=db user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-caesar_quiz} port=5432 sslmode=disable
      PORT: "8080"
      # Origin browser yang diizinkan (dipisah koma). Set ke domain frontend produksi.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend/frontend
    restart: always
    depends_on:
      - app
    environment:
      # Dibaca runtime oleh /runtime-config.js -> bisa ganti tanpa rebuild.
      API_BASE: ${API_BASE:-http://localhost:8080}
      WS_BASE: ${WS_BASE:-ws://localhost:8080}
    ports:
      - "3000:3000"

volumes:
  db-data:
