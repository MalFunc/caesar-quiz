version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caesar_quiz
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=caesar_quiz
      - DATABASE_DSN=host=db user=postgres password=postgres dbname=caesar_quiz port=5432 sslmode=disable
    ports:
      - "8080:8080"

volumes:
  db-data:
